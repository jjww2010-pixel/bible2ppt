name: Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests on Windows
        id: regressions
        shell: pwsh
        run: |
          foreach ($project in @('BibleService', 'BibleIndexService', 'BuildService')) {
            dotnet test "Bible2PPT.Services.$project.Tests/Bible2PPT.Services.$project.Tests.csproj" --verbosity minimal --logger "trx;LogFileName=$project.trx" --results-directory verification-tests
            if ($LASTEXITCODE -ne 0) { throw "$project regression tests failed." }
          }
          python -m unittest discover -s tools -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Windows importer tests failed.' }
      - name: Publish standalone EXE
        id: publish
        shell: pwsh
        run: >-
          dotnet publish Bible2PPT/Bible2PPT.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/${{ matrix.runtime }}
      - name: Run the published EXE
        id: exe
        shell: pwsh
        run: ./scripts/Test-PublishedExe.ps1 -PublishDirectory artifacts/${{ matrix.runtime }} -ResultDirectory verification-exe
      - name: Include usage and license
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/${{ matrix.runtime }}/LICENSE.txt
          Copy-Item docs artifacts/${{ matrix.runtime }}/docs -Recurse
          (Get-Content docs/windows-exe.md -Raw).Replace('(local-bible.md)', '(docs/local-bible.md)') |
            Set-Content artifacts/${{ matrix.runtime }}/READ-ME.md -Encoding utf8
          New-Item -ItemType Directory -Force artifacts/${{ matrix.runtime }}/Diagnostics | Out-Null
          Copy-Item scripts/fixtures/diagnostic-bible.json artifacts/${{ matrix.runtime }}/Diagnostics/example.json
          Copy-Item scripts/fixtures/wrapped-bible.txt artifacts/${{ matrix.runtime }}/Diagnostics/wrapped-example.txt
          Copy-Item scripts/Check-PowerPoint.cmd artifacts/${{ matrix.runtime }}/Check-PowerPoint.cmd
          Copy-Item scripts/Check-Bible.cmd artifacts/${{ matrix.runtime }}/Check-Bible.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Bible2PPT-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}/
          if-no-files-found: error
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.runtime }}
          path: |
            verification-tests/
            verification-exe/
          if-no-files-found: warn
      - name: Publish readable verification result
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          CHECKED_COMMIT: ${{ github.sha }}
          CHECK_RUNTIME: ${{ matrix.runtime }}
          REGRESSION_RESULT: ${{ steps.regressions.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          EXE_RESULT: ${{ steps.exe.outcome }}
        run: ./scripts/Publish-VerificationReport.ps1
