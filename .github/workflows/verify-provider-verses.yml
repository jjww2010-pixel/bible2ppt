name: Verify current provider verse presence
on:
  push:
    branches: [verify-missing-verses]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4
      - name: Inspect current reading pages and translation controls
        run: python check_provider_verses.py "$RUNNER_TEMP/provider-check"
      - name: Publish bounded verification report
        run: |
          report_branch="verification-provider-verses-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          git switch --orphan "$report_branch"
          cp "$RUNNER_TEMP/provider-check/provider-check.json" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-check.json
          git commit -m 'Record current provider translation and verse presence'
          git push origin "HEAD:refs/heads/$report_branch"
