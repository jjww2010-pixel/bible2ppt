name: Verify Logos export documentation

on:
  push:
    branches: [logos-export-verification]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official public documentation
        run: python scripts/verify_logos_export_docs.py "$RUNNER_TEMP/logos-doc-report"
      - name: Publish readable result
        if: always()
        env:
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          report_branch="verification-logos-export-${VERIFIED_COMMIT}-${GITHUB_RUN_ID}"
          git switch --orphan "$report_branch"
          cp -R "$RUNNER_TEMP/logos-doc-report/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md report.json
          git commit -m 'Record official Logos export documentation check'
          git push origin "HEAD:refs/heads/$report_branch"
